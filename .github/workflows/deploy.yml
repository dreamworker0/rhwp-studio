name: Deploy to Firebase Hosting

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # 아래 값들은 모두 클라이언트 번들에 그대로 노출되는 공개 식별자(비밀 아님).
          # Vite는 빌드 시점에 박아넣으므로 CI 빌드에 반드시 주입해야 한다.
          # .env 는 gitignore 되어 CI 에는 없으므로 여기서 명시하지 않으면 누락된다.
          # (진짜 시크릿인 SENTRY_AUTH_TOKEN/소스맵 업로드는 CI 에서 하지 않음 — DSN 만으로 에러 수집됨)
          VITE_GOOGLE_CLIENT_ID: 292079787292-qmjcruc73ogvoffnf63f28nj7ov30csn.apps.googleusercontent.com
          VITE_GA_MEASUREMENT_ID: G-JTGB3FJNSR
          VITE_SENTRY_DSN: https://9fd1e2b373fb6db6ff122cbad8ffd162@o4510929630593024.ingest.us.sentry.io/4511628746555394

      # 서비스계정 키를 임시 파일로 기록 → firebase-tools가 GOOGLE_APPLICATION_CREDENTIALS로 인증.
      # 시크릿을 env로 받아 printf로 그대로 기록(텍스트 치환/heredoc보다 안전 — 들여쓰기·따옴표·줄바꿈 손상 없음).
      - name: Prepare service account
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA" > "$RUNNER_TEMP/gac.json"

      # 배포 전 자격증명 유효성(JSON 구조 + private_key PEM 무결성)을 fail-fast로 확인. (키 미노출)
      - name: Validate service account credentials
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gac.json
        run: |
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const j = JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, "utf8"));
            if (j.type !== "service_account" || !j.client_email) { console.error("::error::SA 키 형식 오류"); process.exit(1); }
            crypto.createPrivateKey(j.private_key);
            console.log("SA OK:", j.client_email, "| project:", j.project_id);
          '

      # 인증은 gcloud(러너에서 토큰 교환 검증됨)로 액세스 토큰을 받고, 배포는 Hosting REST API를
      # native fetch로 직접 호출하는 스크립트로 한다. firebase-tools 15.x의 인증 스택
      # (gaxios 7 / google-auth-library 10)이 러너에서 'Premature close'로 결정적 실패하는
      # 문제를 우회한다. 라우팅/헤더는 현재 라이브 버전 config를 복제해 보존한다.
      - name: Authenticate (gcloud, service account)
        run: gcloud auth activate-service-account --key-file="$RUNNER_TEMP/gac.json" --quiet

      - name: Deploy to Firebase Hosting (REST API)
        run: |
          for i in 1 2 3; do
            echo "::group::Deploy attempt $i"
            TOKEN=$(gcloud auth print-access-token) || { echo "토큰 발급 실패"; echo "::endgroup::"; sleep 15; continue; }
            if GOOGLE_OAUTH_ACCESS_TOKEN="$TOKEN" node scripts/deploy-hosting.mjs; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Attempt $i 실패 — 15초 후 재시도"
            sleep 15
          done
          echo "::error::배포 실패"
          exit 1
