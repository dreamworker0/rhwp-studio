<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support - rhwp Studio</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: #f9fafb;
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h1 {
            color: #1a73e8;
            margin-bottom: 20px;
            border-bottom: 2px solid #e8eaed;
            padding-bottom: 10px;
        }
        p {
            margin-bottom: 20px;
            font-size: 16px;
        }
        .contact-box {
            background-color: #e8f0fe;
            padding: 20px;
            border-radius: 6px;
            border-left: 4px solid #1a73e8;
            margin-top: 30px;
        }
        .contact-email {
            font-size: 18px;
            font-weight: bold;
            color: #1a73e8;
            text-decoration: none;
        }
        .contact-email:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>rhwp Studio Support</h1>
        <p>rhwp Studio 앱을 이용해 주셔서 감사합니다.</p>
        <p>앱 사용 중 발생하는 오류, 설치 관련 문의 및 기타 질문 사항이 있으시다면 아래의 연락처로 문의해 주시기 바랍니다. 확인 후 최대한 빠르게 답변해 드리겠습니다.</p>
        
        <div class="contact-box">
            <p style="margin-bottom: 5px; font-weight: bold; color: #5f6368;">고객 지원 이메일 (Contact Email)</p>
            <a href="mailto:ehsheh@gmail.com" class="contact-email">ehsheh@gmail.com</a>
        </div>
    </div>
</body>
</html>
