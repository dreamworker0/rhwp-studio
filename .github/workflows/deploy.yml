name: Deploy to Firebase Hosting

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # 공개 OAuth Client ID — 클라이언트 번들에 그대로 노출되는 값이라 비밀이 아님.
          # Vite는 빌드 시점에 이 값을 번들에 박아넣으므로 CI 빌드에 반드시 필요하다.
          VITE_GOOGLE_CLIENT_ID: 292079787292-qmjcruc73ogvoffnf63f28nj7ov30csn.apps.googleusercontent.com

      # 서비스계정 키를 임시 파일로 기록 → firebase-tools가 GOOGLE_APPLICATION_CREDENTIALS로 인증.
      # 따옴표된 heredoc('SA')라 secret 내용은 셸 해석 없이 그대로(멀티라인/특수문자 포함) 안전하게 기록된다.
      - name: Prepare service account
        run: |
          cat > "$RUNNER_TEMP/gac.json" <<'SA'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SA

      # 시크릿이 비었거나 깨졌으면(잘림/따옴표/base64) 여기서 즉시 명확한 에러로 중단한다.
      # (키 내용은 노출하지 않고 client_email/project만 출력) — 'Failed to authenticate' 의
      # 모호한 실패를 재시도로 흡수하려다 시간 낭비하는 것을 방지한다.
      - name: Validate service account credentials
        run: |
          node -e '
            const fs = require("fs");
            const p = process.env.GOOGLE_APPLICATION_CREDENTIALS;
            let j;
            try { j = JSON.parse(fs.readFileSync(p, "utf8")); }
            catch (e) { console.error("::error::gac.json 파싱 실패 — FIREBASE_SERVICE_ACCOUNT 시크릿이 비었거나 깨졌습니다: " + e.message); process.exit(1); }
            if (j.type !== "service_account" || !j.client_email || !String(j.private_key||"").includes("BEGIN PRIVATE KEY")) {
              console.error("::error::유효한 서비스계정 키가 아닙니다 (client_email/private_key 누락)"); process.exit(1);
            }
            console.log("SA OK:", j.client_email, "| project:", j.project_id);
          '
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gac.json

      # 'Failed to authenticate'(자격증명 문제)는 위 검증 단계에서 이미 걸러진다.
      # 여기 재시도는 OAuth 토큰 교환 중 'Premature close'(일시적 네트워크 오류) 같은
      # 진짜 일시적 실패만 대기 후 흡수한다.
      - name: Deploy to Firebase Hosting (retry on transient errors)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 20
          # firebase-tools는 재현성을 위해 고정. (15.8.0/최신 모두 동일한 일시적 오류를
          # 겪었으므로 버전이 원인은 아님 — 핀은 빌드 재현성 목적.)
          command: npx -y firebase-tools@15.8.0 deploy --only hosting --project rhwp-studio --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gac.json
