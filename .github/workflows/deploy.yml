name: Deploy to Firebase Hosting

on:
  # ⚠️ push 자동 배포 일시 비활성화 (2026-06): firebase-tools 15.x 인증 스택
  # (gaxios 7 / google-auth-library 10)이 러너에서 OAuth 토큰 교환 시 'Premature close'로
  # 결정적 실패 → 매 push마다 빨간불. 그동안 배포는 로컬 수동(/deploy)으로 한다.
  # 업스트림 수정 후 아래 push 트리거를 복원할 것. (수동 테스트는 workflow_dispatch로 가능)
  # push:
  #   branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # 공개 OAuth Client ID — 클라이언트 번들에 그대로 노출되는 값이라 비밀이 아님.
          # Vite는 빌드 시점에 이 값을 번들에 박아넣으므로 CI 빌드에 반드시 필요하다.
          VITE_GOOGLE_CLIENT_ID: 292079787292-qmjcruc73ogvoffnf63f28nj7ov30csn.apps.googleusercontent.com

      # 서비스계정 키를 임시 파일로 기록 → firebase-tools가 GOOGLE_APPLICATION_CREDENTIALS로 인증.
      # 시크릿을 env로 받아 printf로 그대로 기록(텍스트 치환/heredoc보다 안전 — 들여쓰기·따옴표·줄바꿈 손상 없음).
      - name: Prepare service account
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA" > "$RUNNER_TEMP/gac.json"

      # 배포 전 자격증명 유효성(JSON 구조 + private_key PEM 무결성)을 fail-fast로 확인. (키 미노출)
      - name: Validate service account credentials
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gac.json
        run: |
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const j = JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, "utf8"));
            if (j.type !== "service_account" || !j.client_email) { console.error("::error::SA 키 형식 오류"); process.exit(1); }
            crypto.createPrivateKey(j.private_key);
            console.log("SA OK:", j.client_email, "| project:", j.project_id);
          '

      # ⚠️ 알려진 문제(2026-06): firebase-tools(15.x)의 인증 의존성 스택
      # (gaxios 7.x / google-auth-library 10.x)이 GitHub 러너에서 OAuth 토큰 교환 시
      # 'Premature close'로 결정적으로 실패한다. (gcloud/curl/구 스택은 정상 — 업스트림 회귀로 추정.)
      # 재시도로도 회피 불가. 업스트림 수정 전까지는 로컬 수동 배포(`/deploy`)로 대체한다.
      - name: Deploy to Firebase Hosting (retry on transient errors)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gac.json
        run: |
          for i in $(seq 1 3); do
            echo "::group::Deploy attempt $i"
            if npx -y firebase-tools@15.8.0 deploy --only hosting --project rhwp-studio --non-interactive; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Attempt $i 실패 — 20초 후 재시도"
            sleep 20
          done
          echo "::error::배포 실패 — firebase-tools 인증 스택 'Premature close' 회귀로 추정. 로컬 수동 배포로 대체하세요."
          exit 1
